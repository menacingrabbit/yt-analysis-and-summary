[project]
name = "yt-analysis-and-summary"
version = "0.1.0"
description = "Download YouTube audio, transcribe it with OpenRouter, and optionally summarise."
requires-python = ">=3.11"

[project.scripts]
yt-analysis = "src.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: requires live network access (skipped by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.black]
line-length = 100
target-version = ["py311"]
